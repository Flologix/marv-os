[package]
name = "marv-mesh"
description = "Switchboard, plugs and receptacles: wired comms lines between sandboxed agents."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio-util.workspace = true
marv-core.workspace = true
# An agent's name (`marv_kernel::name_base`, `mesh_name_for`).
marv-kernel.workspace = true
# The plug is an MCP client and the switchboard an MCP server: shared JSON-RPC types.
marv-mcp.workspace = true
marv-sandbox.workspace = true
# Local sockets on every platform, and Unix file modes that are no-ops on Windows.
marv-fs.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
socket2.workspace = true
# This process's uid (`own_uid`), without /proc or `unsafe`.
nix = { version = "0.31.3", features = ["user"] }
async-trait.workspace = true
thiserror.workspace = true
# The AgentMesh bridge endpoint (loopback check).
url = "2.5.4"
# chat_read's best-effort secret redaction (runtime-kernel §9.2).
regex = "1.11"

[lints]
workspace = true
