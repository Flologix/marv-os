[package]
name = "marv-fs"
description = "Shared file helpers below marv-mcp and marv-session: private (0600) writes and a cross-process file lock."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true, features = ["fs", "io-util", "net", "rt", "sync", "time"] }
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["user", "fs"] }

[target.'cfg(windows)'.dependencies]
# The Windows local socket's token: a real secret, from the OS's generator.
getrandom = "0.3.4"

[dev-dependencies]
futures.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true
