name: Feature request
description: Suggest something Marv OS should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or the workflow, before the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Marv OS to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
